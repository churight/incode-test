name: incode github actions docker

on:
    push:
        branches:
            main

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Set up Docker
              uses: docker/setup-buildx-action@v3
            
            - name: Build with Docker Compose
              run: docker compose build

